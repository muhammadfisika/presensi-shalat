<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <title>Presensi Shalat QR</title>

    <link rel="stylesheet"
          href="style.css">

    <!-- Library Scanner QR -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

</head>


<body>

<div class="container">

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="header">

        <div class="icon">
            🕌
        </div>

        <h1>
            Presensi Shalat
        </h1>

        <p>
            Presensi kehadiran siswa melalui QR Code
        </p>

    </div>


    <!-- ============================= -->
    <!-- PENGATURAN PRESENSI -->
    <!-- ============================= -->

    <div class="card">

        <h2>
            Pengaturan Presensi
        </h2>


        <!-- TANGGAL -->

        <label for="tanggal">
            Tanggal
        </label>

        <input
            type="date"
            id="tanggal"
        >


        <!-- SHALAT -->

        <label for="shalat">
            Jenis Shalat
        </label>

        <select id="shalat">

            <option value="">
                -- Pilih Shalat --
            </option>

            <option value="Dhuha">
                Dhuha
            </option>

            <option value="Dhuhur">
                Dhuhur
            </option>

            <option value="Ashar">
                Ashar
            </option>

        </select>


        <!-- STATUS -->

        <label>
            Status
        </label>


        <div class="status-container">

            <label class="radio-box">

                <input
                    type="radio"
                    name="status"
                    value="Hadir"
                >

                <span>
                    ✓ Hadir
                </span>

            </label>


            <label class="radio-box">

                <input
                    type="radio"
                    name="status"
                    value="Haid"
                >

                <span>
                    ♀ Haid
                </span>

            </label>

        </div>


        <!-- BUTTON MULAI -->

        <button
            id="btnScan"
            onclick="mulaiScan()"
        >
            📷 MULAI SCAN QR CODE
        </button>


        <!-- PESAN -->

        <div
            id="pesan"
            class="pesan">
        </div>

    </div>


    <!-- ============================= -->
    <!-- AREA SCANNER -->
    <!-- ============================= -->

    <div
        id="scannerContainer"
        class="scanner-container"
        style="display:none;"
    >

        <h2>
            📷 Scanner QR Code
        </h2>


        <p class="petunjuk">
            Arahkan kamera ke QR Code siswa
        </p>


        <!-- STATUS SCANNER -->

        <div
            id="scannerStatus"
            class="scanner-status"
        >
            Kamera belum aktif
        </div>


        <!-- AREA KAMERA -->

        <div
            class="camera-wrapper"
        >

            <div
                id="reader">
            </div>


            <!-- NOTIFIKASI MELAYANG -->

            <div
                id="notifikasi"
                class="notifikasi"
            >

                <div
                    id="notifikasiIcon"
                    class="notifikasi-icon">
                </div>


                <div
                    class="notifikasi-content"
                >

                    <div
                        id="notifikasiJudul"
                        class="notifikasi-judul">
                    </div>


                    <div
                        id="notifikasiPesan"
                        class="notifikasi-pesan">
                    </div>

                </div>

            </div>

        </div>


        <!-- PETUNJUK -->

        <div
            id="scanInfo"
            class="scan-info"
        >
            Scan siswa berikutnya...
        </div>


        <!-- BUTTON SELESAI -->

        <button
            class="btnStop"
            onclick="stopScanner()"
        >
            ⏹ SELESAI SCAN
        </button>

    </div>


    <!-- ============================= -->
    <!-- HASIL TERAKHIR -->
    <!-- ============================= -->

    <div
        id="hasil"
        class="hasil"
        style="display:none;"
    >

        <h2>
            📋 Presensi Terakhir
        </h2>


        <div
            id="hasilData">
        </div>

    </div>


</div>


<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<script
    src="script.js">
</script>


<!-- ============================= -->
<!-- SERVICE WORKER -->
<!-- ============================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .then(function () {

                    console.log(
                        "Service Worker aktif"
                    );

                })
                .catch(function (error) {

                    console.log(
                        "Service Worker gagal:",
                        error
                    );

                });

        }
    );

}

</script>


</body>

</html>
