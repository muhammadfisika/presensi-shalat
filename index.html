<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Presensi Shalat</title>

    <link rel="stylesheet" href="style.css">

    <!-- Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="icon">🕌</div>

        <h1>Presensi Shalat</h1>

        <p>
            Presensi kehadiran melalui QR Code
        </p>

    </div>


    <!-- FORM -->
    <div class="card">

        <label for="tanggal">
            Tanggal
        </label>

        <input
            type="date"
            id="tanggal"
        >


        <label for="shalat">
            Jenis Shalat
        </label>

        <select id="shalat">

            <option value="">
                -- Pilih Shalat --
            </option>

            <option value="Dhuha">
                Dhuha
            </option>

            <option value="Dhuhur">
                Dhuhur
            </option>

            <option value="Ashar">
                Ashar
            </option>

        </select>


        <label>
            Status
        </label>

        <div class="status-container">

            <label class="radio-box">

                <input
                    type="radio"
                    name="status"
                    value="Hadir"
                >

                <span>Hadir</span>

            </label>


            <label class="radio-box">

                <input
                    type="radio"
                    name="status"
                    value="Haid"
                >

                <span>Haid</span>

            </label>

        </div>


        <button
            id="btnScan"
            onclick="mulaiScan()"
        >

            📷 MULAI SCAN QR CODE

        </button>


        <div
            id="pesan"
            class="pesan"
        ></div>

    </div>


    <!-- SCANNER -->
    <div
        id="scannerContainer"
        class="scanner-container"
        style="display:none;"
    >

        <h2>Scan QR Code</h2>

        <p>
            Arahkan kamera ke QR Code siswa
        </p>


        <div id="reader"></div>


        <button
            class="btnStop"
            onclick="stopScanner()"
        >

            ✕ Tutup Kamera

        </button>

    </div>


    <!-- HASIL SCAN -->
    <div
        id="hasil"
        class="hasil"
        style="display:none;"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>QR Berhasil Dibaca</h2>

        <div id="hasilData"></div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
